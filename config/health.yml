- name: Health
  columns:
    - size: small
      widgets:
        - type: custom-api
          title: Heute
          cache: 2m
          url: http://ics-proxy:3000/health-api/summary
          template: |
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Schlaf</span><span class="color-highlight size-h4">{{ if .JSON.Float "sleep.value" }}{{ printf "%.1f" (.JSON.Float "sleep.value") }} h{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Ruhepuls</span><span class="color-highlight size-h4">{{ if .JSON.Float "resting_hr.value" }}{{ printf "%.0f" (.JSON.Float "resting_hr.value") }} bpm{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">HRV</span><span class="color-highlight size-h4">{{ if .JSON.Float "hrv.value" }}{{ printf "%.0f" (.JSON.Float "hrv.value") }} ms{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Schritte</span><span class="color-highlight size-h4">{{ if .JSON.Float "steps.value" }}{{ printf "%.0f" (.JSON.Float "steps.value") }}{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Aktive Energie</span><span class="color-highlight size-h4">{{ if .JSON.Float "active_energy.value" }}{{ printf "%.0f" (.JSON.Float "active_energy.value") }} kcal{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Gewicht</span><span class="color-highlight size-h4">{{ if .JSON.Float "weight.value" }}{{ printf "%.1f" (.JSON.Float "weight.value") }} kg{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Körperfett</span><span class="color-highlight size-h4">{{ if .JSON.Float "body_fat.value" }}{{ printf "%.1f" (.JSON.Float "body_fat.value") }} %{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">BMI</span><span class="color-highlight size-h4">{{ if .JSON.Float "bmi.value" }}{{ printf "%.1f" (.JSON.Float "bmi.value") }}{{ else }}–{{ end }}</span></div>

        - type: custom-api
          title: Aktivität & Ernährung
          cache: 2m
          url: http://ics-proxy:3000/health-api/summary
          template: |
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">VO₂ Max</span><span class="color-highlight size-h4">{{ if .JSON.Float "vo2_max.value" }}{{ printf "%.1f" (.JSON.Float "vo2_max.value") }} ml/kg/min{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Trainingsminuten</span><span class="color-highlight size-h4">{{ if .JSON.Float "exercise_min.value" }}{{ printf "%.0f" (.JSON.Float "exercise_min.value") }} min{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Etagen</span><span class="color-highlight size-h4">{{ if .JSON.Float "flights.value" }}{{ printf "%.0f" (.JSON.Float "flights.value") }}{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Tageslicht</span><span class="color-highlight size-h4">{{ if .JSON.Float "daylight.value" }}{{ printf "%.0f" (.JSON.Float "daylight.value") }} min{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Wasser</span><span class="color-highlight size-h4">{{ if .JSON.Float "water.value" }}{{ printf "%.0f" (.JSON.Float "water.value") }} mL{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Kalorien</span><span class="color-highlight size-h4">{{ if .JSON.Float "energy_intake.value" }}{{ printf "%.0f" (.JSON.Float "energy_intake.value") }} kcal{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Kohlenhydrate</span><span class="color-highlight size-h4">{{ if .JSON.Float "carbs.value" }}{{ printf "%.0f" (.JSON.Float "carbs.value") }} g{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Protein</span><span class="color-highlight size-h4">{{ if .JSON.Float "protein.value" }}{{ printf "%.0f" (.JSON.Float "protein.value") }} g{{ else }}–{{ end }}</span></div>
              <div style="display:flex;justify-content:space-between;align-items:baseline;margin:7px 0;"><span class="size-h5">Fett</span><span class="color-highlight size-h4">{{ if .JSON.Float "fat.value" }}{{ printf "%.0f" (.JSON.Float "fat.value") }} g{{ else }}–{{ end }}</span></div>

