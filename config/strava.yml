- name: Strava
  columns:
    - size: small
      widgets:
        - type: custom-api
          title: Athlet
          cache: 1h
          url: http://ics-proxy:3000/strava/athlete
          template: |
            <div class="color-highlight size-h3">{{ .JSON.String "firstname" }} {{ .JSON.String "lastname" }}</div>
            <div class="size-h6">{{ .JSON.String "city" }}{{ if and (.JSON.String "city") (.JSON.String "country") }}, {{ end }}{{ .JSON.String "country" }}</div>
            {{ if .JSON.Float "weight" }}<div class="size-h6">{{ printf "%.0f" (.JSON.Float "weight") }} kg</div>{{ end }}

        - type: custom-api
          title: Zusammenfassung (30 Akt.)
          cache: 10m
          url: http://ics-proxy:3000/strava/stats
          template: |
            <div style="display:flex; justify-content:space-between; text-align:center;">
              <div><div class="color-highlight size-h2">{{ printf "%.0f" (.JSON.Float "totals.km") }}</div><div class="size-h6">km</div></div>
              <div><div class="color-highlight size-h2">{{ printf "%.0f" (.JSON.Float "totals.hours") }}</div><div class="size-h6">Std.</div></div>
              <div><div class="color-highlight size-h2">{{ .JSON.Int "totals.relative_effort" }}</div><div class="size-h6">Score</div></div>
            </div>
            <div class="size-h6" style="margin-top:8px;">{{ .JSON.Int "totals.count" }} Aktivitäten · {{ .JSON.Int "totals.elevation_m" }} m ↑</div>

        - type: custom-api
          title: Jahresziel (YTD)
          cache: 30m
          url: http://ics-proxy:3000/strava/ytd
          template: |
            {{ if gt (len (.JSON.Array "sports")) 0 }}
              <div class="size-h5 color-base" style="margin-bottom:6px;">{{ .JSON.Int "year" }}</div>
              {{ range .JSON.Array "sports" }}
                <div style="margin:12px 0;">
                  <div style="display:flex; justify-content:space-between; align-items:baseline;">
                    <span class="color-highlight size-h3">{{ .String "label" }}</span>
                    <span class="size-h4">{{ printf "%.0f" (.Float "km") }} km{{ if .Int "goalKm" }} / {{ .Int "goalKm" }}{{ end }}</span>
                  </div>
                  {{ if .Int "goalKm" }}
                    <div style="background:var(--color-separator); border-radius:4px; height:9px; margin-top:6px; overflow:hidden;">
                      <div style="background:var(--color-primary); height:9px; width:{{ .Int "pct" }}%;"></div>
                    </div>
                  {{ end }}
                  <div class="size-h6 color-base" style="margin-top:4px;">{{ .Int "count" }} Akt. · {{ printf "%.0f" (.Float "hours") }} h · {{ .Int "elevation_m" }} m ↑</div>
                </div>
              {{ end }}
            {{ else }}
              <p>Keine Aktivitäten dieses Jahr.</p>
            {{ end }}

        - type: custom-api
          title: Fahrrad-Wartung
          cache: 10m
          url: http://ics-proxy:3000/bike/maintenance
          template: |
            {{ if gt (len (.JSON.Array "items")) 0 }}
              {{ range .JSON.Array "items" }}
                <div style="margin:8px 0;">
                  <div style="display:flex; align-items:flex-start; gap:6px;">
                    <span style="width:9px; height:9px; border-radius:2px; background:{{ .String "color" }}; display:inline-block; flex-shrink:0; margin-top:4px;"></span>
                    <span style="font-weight:600;">{{ .String "label" }}</span>
                  </div>
                  <div style="background:var(--color-separator); border-radius:4px; height:5px; margin-top:5px; overflow:hidden;">
                    <div style="background:{{ .String "color" }}; height:5px; width:{{ .Int "pct" }}%;"></div>
                  </div>
                  <div class="size-h6" style="color:{{ .String "color" }}; margin-top:3px;">{{ .String "status" }} &middot; {{ .Int "progress" }}/{{ .Int "interval" }} {{ .String "unit" }}</div>
                </div>
              {{ end }}
            {{ else }}
              <p>Keine Wartungsdaten.</p>
            {{ end }}

    - size: full
      widgets:
        - type: custom-api
          title: "Trainingsbelastung (Akut:Chronisch)"
          cache: 30m
          url: http://ics-proxy:3000/strava/load
          template: |
            {{ if ne (.JSON.String "status") "Keine Daten" }}
              <div style="display:flex; align-items:baseline; gap:12px;">
                <span style="font-size:2.4rem; font-weight:700; color:{{ .JSON.String "color" }};">{{ .JSON.Float "ratio" }}</span>
                <span class="size-h3" style="color:{{ .JSON.String "color" }};">{{ .JSON.String "status" }}</span>
              </div>
              <div class="size-h6" style="margin:4px 0 12px;">Akut (7 T): {{ .JSON.Int "acute" }} · Chronisch (Ø/Woche): {{ .JSON.Int "chronicWeekly" }} · Relative Belastung</div>
              <div style="position:relative;">
                <div style="display:flex; height:18px; border-radius:9px; overflow:hidden;">
                  <div style="flex:0 0 40%; background:#4a90d9;"></div>
                  <div style="flex:0 0 25%; background:#2e9e5b;"></div>
                  <div style="flex:0 0 10%; background:#e8913a;"></div>
                  <div style="flex:0 0 25%; background:#d0473f;"></div>
                </div>
                <div style="position:absolute; top:-3px; height:24px; left:{{ .JSON.Int "gaugePct" }}%; width:3px; background:var(--color-text-highlight); transform:translateX(-50%); border-radius:2px;"></div>
              </div>
              <div style="display:flex; margin-top:6px; font-size:0.85rem; font-weight:600; line-height:1.1;">
                <div style="flex:0 0 40%; text-align:center; color:#4a90d9;">Untertraining</div>
                <div style="flex:0 0 25%; text-align:center; color:#2e9e5b;">Optimal</div>
                <div style="flex:0 0 10%; text-align:center; color:#e8913a;">Hoch</div>
                <div style="flex:0 0 25%; text-align:center; color:#d0473f;">Risiko</div>
              </div>
              <div style="display:flex; margin-top:2px; font-size:0.9rem; font-weight:600; color:var(--color-text-subdue);">
                <div style="flex:0 0 40%; text-align:right; padding-right:2px;">0.8</div>
                <div style="flex:0 0 25%; text-align:right; padding-right:2px;">1.3</div>
                <div style="flex:0 0 10%; text-align:right; padding-right:2px;">1.5</div>
                <div style="flex:0 0 25%; text-align:right; padding-right:2px;">2.0</div>
              </div>
            {{ else }}
              <p>Nicht genug Trainingsdaten für eine Auswertung.</p>
            {{ end }}

        # These three widgets share one chart engine (assets/strava-chart.js,
        # served by glance's own static assets path so it loads once and is
        # browser-cached instead of being duplicated inline three times).
        # The template only needs a container div and a tiny boot snippet:
        # glance inserts widget HTML via innerHTML, which never executes a
        # plain <script> tag, so the classic onerror-on-a-broken-<img> trick
        # is still what gets our JS to actually run.
        - type: custom-api
          title: Ø Herzfrequenz
          cache: 1d
          url: http://ics-proxy:3000/health
          template: |
            <div id="sc-hr"></div>
            <img src="x" onerror="(function(){function boot(){window.StravaChart('sc-hr','hr','var(--color-primary)','bpm','${API_TOKEN}');} if(window.StravaChart){boot();}else{var s=document.createElement('script');s.src='/assets/strava-chart.js';s.onload=boot;document.head.appendChild(s);}})(); this.remove();" style="display:none">

        - type: custom-api
          title: Aktivitäts-Score (Relative Belastung)
          cache: 1d
          url: http://ics-proxy:3000/health
          template: |
            <div id="sc-effort"></div>
            <img src="x" onerror="(function(){function boot(){window.StravaChart('sc-effort','effort','var(--color-positive)','Score','${API_TOKEN}');} if(window.StravaChart){boot();}else{var s=document.createElement('script');s.src='/assets/strava-chart.js';s.onload=boot;document.head.appendChild(s);}})(); this.remove();" style="display:none">

        - type: custom-api
          title: Distanz
          cache: 1d
          url: http://ics-proxy:3000/health
          template: |
            <div id="sc-dist"></div>
            <img src="x" onerror="(function(){function boot(){window.StravaChart('sc-dist','distance','var(--color-primary)','km','${API_TOKEN}');} if(window.StravaChart){boot();}else{var s=document.createElement('script');s.src='/assets/strava-chart.js';s.onload=boot;document.head.appendChild(s);}})(); this.remove();" style="display:none">

    - size: small
      widgets:
        - type: custom-api
          title: HF-Zonenverteilung (letzte Aktivität mit HF)
          cache: 10m
          url: http://ics-proxy:3000/strava/stats
          template: |
            {{ if gt (len (.JSON.Array "hrPie")) 0 }}
              <div style="display:flex; align-items:center; gap:12px;">
                <svg viewBox="0 0 42 42" style="width:110px; height:110px; flex-shrink:0;">
                  {{ range .JSON.Array "hrPie" }}
                    {{ if .Bool "full" }}
                      <circle cx="21" cy="21" r="20" fill="{{ .String "color" }}" />
                    {{ else }}
                      <path d="{{ .String "d" }}" fill="{{ .String "color" }}" />
                    {{ end }}
                  {{ end }}
                </svg>
                <div style="flex:1;">
                  {{ range .JSON.Array "hrPie" }}
                    <div style="display:flex; align-items:center; gap:6px; margin:2px 0;">
                      <span style="width:10px; height:10px; border-radius:2px; background:{{ .String "color" }}; display:inline-block; flex-shrink:0;"></span>
                      <span class="size-h6" style="flex:1;">{{ .String "zone" }}</span>
                      <span class="size-h6">{{ .Int "minutes" }}m · {{ .Int "pct" }}%</span>
                    </div>
                  {{ end }}
                </div>
              </div>
              <div class="size-h6" style="margin-top:10px;">{{ .JSON.String "hrZones.sport" }} · {{ .JSON.String "hrZones.activity" }} · {{ .JSON.String "hrZones.when" }}</div>
            {{ else }}
              <p>Keine Zonendaten in der letzten Aktivität mit HF.</p>
            {{ end }}

        - type: custom-api
          title: Letzte Aktivitäten
          cache: 10m
          url: http://ics-proxy:3000/strava/stats
          template: |
            {{ if eq (len (.JSON.Array "recent")) 0 }}
              <p>Keine Aktivitäten.</p>
            {{ else }}
              <ul class="list list-gap-10" style="max-height:320px; overflow-y:auto; padding-right:4px;">
                {{ range .JSON.Array "recent" }}
                  <li>
                    <div class="size-h5"><a href="https://www.strava.com/activities/{{ .Int "id" }}" target="_blank" rel="noopener" class="color-highlight" style="text-decoration:underline;">{{ .String "name" }}</a></div>
                    <div class="size-h6">{{ .String "sport_type" }} · {{ .String "when" }}</div>
                    <div class="size-h6">
                      {{ if .Float "distance_km" }}{{ printf "%.1f" (.Float "distance_km") }} km · {{ end }}{{ .String "moving_time" }}{{ if .Int "relative_effort" }} · Score {{ .Int "relative_effort" }}{{ end }}{{ if .Float "avg_hr" }} · {{ printf "%.0f" (.Float "avg_hr") }} bpm{{ end }}
                    </div>
                  </li>
                {{ end }}
              </ul>
            {{ end }}

        - type: custom-api
          title: Readiness
          cache: 30m
          url: http://ics-proxy:3000/strava/readiness
          template: |
            <div style="display:flex; align-items:center; gap:14px;">
              <div style="position:relative; width:72px; height:72px; flex-shrink:0;">
                <svg viewBox="0 0 42 42" style="width:72px; height:72px; transform:rotate(-90deg);">
                  <circle cx="21" cy="21" r="17" fill="none" stroke="var(--color-separator)" stroke-width="5"></circle>
                  <circle cx="21" cy="21" r="17" fill="none" stroke="{{ .JSON.String "color" }}" stroke-width="5"
                    stroke-dasharray="{{ .JSON.Int "score" }} 100" stroke-linecap="round"
                    pathLength="100"></circle>
                </svg>
                <div style="position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:1.2rem; font-weight:700; color:{{ .JSON.String "color" }};">{{ .JSON.Int "score" }}</div>
              </div>
              <div>
                <div class="size-h3" style="color:{{ .JSON.String "color" }}; font-weight:700;">{{ .JSON.String "recommendation" }}</div>
                <div class="size-h6 color-base" style="margin-top:2px;">
                  {{ if .JSON.Float "acwr" }}ACWR {{ .JSON.Float "acwr" }}{{ end }}{{ if .JSON.Int "daysSinceLast" }} · {{ .JSON.Int "daysSinceLast" }} T seit Training{{ end }}
                </div>
              </div>
            </div>
            {{ if .JSON.String "note" }}
              <div class="size-h6 color-base" style="margin-top:10px; line-height:1.5;">{{ .JSON.String "note" }}</div>
            {{ end }}
