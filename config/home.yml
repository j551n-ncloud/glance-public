- name: Home
  columns:
    - size: small
      widgets:
        - type: clock
          hour-format: 24h
          timezones:
            - timezone: Europe/Berlin
              label: Heidelberg

        - type: custom-api
          title: Termine
          cache: 5m
          url: http://ics-proxy:3000/ics-events
          template: |
            {{ if eq (len (.JSON.Array "")) 0 }}
              <p>Keine anstehenden Termine.</p>
            {{ else }}
              <ul class="list list-gap-10" style="max-height:260px; overflow-y:auto; padding-right:4px;">
                {{ range .JSON.Array "" }}
                  <li>
                    <div class="color-highlight size-h4">{{ .String "title" }}</div>
                    <div class="size-h6">{{ .String "when" }}</div>
                    {{ if .String "location" }}
                      <div class="text-truncate size-h6">
                        <a href="{{ .String "location" }}" target="_blank" rel="noopener">Join</a>
                      </div>
                    {{ end }}
                  </li>
                {{ end }}
              </ul>
            {{ end }}

        # Location comes from the WEATHER_LOCATION env (set in docker-compose,
        # overridable via .env). Glance errors if the var is missing, so compose
        # provides a default.
        - type: weather
          location: ${WEATHER_LOCATION}
          units: metric
          hour-format: 24h

    - size: full
      widgets:
        - type: bookmarks
          groups:
            - title: Quick
              links:
                - title: Proxmox UI
                  url: https://mdm.home.example.com
                - title: Portainer
                  url: https://portainer.home.example.com
                - title: Vaultwarden
                  url: https://vault.home.example.com

            - title: GitLab
              links:
                - title: GitLab
                  url: https://gitlab.home.example.com
                - title: Merge Requests
                  url: https://gitlab.home.example.com/dashboard/merge_requests

            - title: Tools
              links:
                - title: Grafana
                  url: https://grafana.home.example.com
                - title: DJ
                  url: https://music.home.example.com

            - title: Nextcloud
              links:
                - title: Dateien
                  url: https://nextcloud.home.example.com/apps/files
                - title: Kalender
                  url: https://nextcloud.home.example.com/apps/calendar

        - type: monitor
          cache: 5m
          title: Service Status
          sites:
            - title: GitLab
              url: https://gitlab.home.example.com
              icon: si:gitlab
            - title: Proxmox
              url: https://mdm.home.example.com
              icon: si:proxmox
              allow-insecure: true
            - title: Grafana
              url: https://grafana.home.example.com
              icon: si:grafana
            - title: Portainer
              url: https://portainer.home.example.com
              icon: si:portainer
            - title: Nextcloud
              url: https://nextcloud.home.example.com
              icon: si:nextcloud
            - title: Immich
              url: https://photos.home.example.com
              icon: si:immich

        - type: custom-api
          title: Spotify
          cache: 1s
          template: |
            <style>
              .offline-indicator {
                width: 8px;
                height: 7px;
                border-radius: 50%;
                background-color: var(--color-negative);
                display: inline-block;
                margin-left: 4px;
                vertical-align: middle;
              }

              .indicators-container {
                display: flex;
                align-items: center;
                gap: 4px;
              }
            </style>
            {{
              $tokenRes := newRequest "https://accounts.spotify.com/api/token"
                | withHeader "Authorization" "Basic ${SPOTIFY_BTOA}"
                | withHeader "Content-Type" "application/x-www-form-urlencoded"
                | withStringBody "grant_type=refresh_token&refresh_token=${SPOTIFY_REFRESH}"
                | getResponse
            }}

            {{ if eq $tokenRes.Response.StatusCode 200 }}
              {{ $accessToken := $tokenRes.JSON.String "access_token" }}

              {{ $currentlyPlaying := newRequest "https://api.spotify.com/v1/me/player"
                  | withHeader "Authorization" (print "Bearer " $accessToken)
                  | getResponse
              }}
              {{ if eq $currentlyPlaying.Response.StatusCode 204 }}
              <div class="flex items-center">
                <p style="margin-right:10px;">Offline</p>
                <div class="indicators-container">
                  <span class="offline-indicator" data-popover-type="text"
                        data-popover-text="No current playback">
                  </span>
                </div>
              </div>
              {{ end}}

              {{ $isCurrentlyPlaying := $currentlyPlaying.JSON.Bool "is_playing" }}
              {{ $isDeviceActive := $currentlyPlaying.JSON.Bool "device.is_active" }}
              {{ $isPrivateSession := $currentlyPlaying.JSON.Bool "device.is_private_session" }}
              {{ $deviceName := $currentlyPlaying.JSON.String "device.name" }}
              {{ $queueRes := newRequest "https://api.spotify.com/v1/me/player/queue"
                  | withHeader "Authorization" (print "Bearer " $accessToken)
                  | getResponse
              }}

              {{ if eq $queueRes.Response.StatusCode 200 }}
                {{ $data := $queueRes.JSON }}
                {{ $queue := $data.Array "queue" }}

                {{ $artist := $data.String "currently_playing.artists.0.name" }}

                {{ if gt (len $artist) 0 }}
                <div class="size-h5">NOW PLAYING</div>
                <div class="widget-content-frame flex flex-row items-center gap-20" style="padding: 4px; margin-top: 4px; margin-bottom: 4px;">
                  <div>
                    <img src="{{ $data.String "currently_playing.album.images.0.url" }}" style="border-radius: 5px; width: 5rem;" class="card">
                  </div>
                  <div class="flex grow flex-column justify-center pr-2">
                    <div class="color-positive size-h4 font-bold">{{ $data.String "currently_playing.name" }}</div>
                    <div class="size-h5">{{ $artist }}</div>
                  </div>
                  {{ if and $isDeviceActive (not $isPrivateSession) }}
                    {{ if $isCurrentlyPlaying }}
                      <div style="margin-right:10px; height: 100%; display: flex; flex-direction: column;">
                        <button style="font-size:25px;" onclick="fetch('https://api.spotify.com/v1/me/player/pause',{method:'PUT',headers:{'Authorization':'Bearer {{$accessToken}}'}});">⏸</button>
                        <p>{{ $deviceName }}</p>
                      </div>
                    {{ else }}
                      <div style="margin-right:10px; height: 100%; display: flex; flex-direction: column;">
                        <button style="font-size:25px;" onclick="fetch('https://api.spotify.com/v1/me/player/play',{method:'PUT',headers:{'Authorization':'Bearer {{$accessToken}}'}});">▶</button>
                        <p>{{ $deviceName }}</p>
                      </div>
                    {{ end }}
                  {{ else if $isPrivateSession }}
                  <p style="margin-right:10px;">Private session</p>
                  {{ else }}
                  <p style="margin-right:10px;">Error</p>
                  {{ end }}
                </div>
                {{ end }}

                {{ if gt (len $queue) 0 }}
                  <div class="size-h5 color-muted font-bold" style="margin-top: 10px;">UPCOMING:</div>
                  {{ range $i, $track := $queue }}
                    {{ if lt $i 5 }}
                      <div
                        class="widget-content-frame flex flex-row items-center gap-20"
                        style="padding: 4px; margin-top: 4px; margin-bottom: 4px; cursor: pointer;"
                        onclick="(function(){
                          for (let j = 0; j < {{ add $i 1}}; j++) {
                            fetch('https://api.spotify.com/v1/me/player/next', {
                              method: 'POST',
                              headers: {
                                'Authorization': 'Bearer {{ $accessToken }}'
                              }
                            });
                          }
                        })()"
                      >
                        <div>
                          <img src="{{ $track.String "album.images.0.url" }}" style="border-radius: 5px; width: 5rem;" class="card">
                        </div>
                        <div class="flex grow flex-column justify-center pr-2">
                          <div class="color-positive size-h4 font-bold">{{ $track.String "name" }}</div>
                          <div class="size-h5">{{ $track.String "artists.0.name" }}</div>
                        </div>
                      </div>
                    {{ end }}
                  {{ end }}
                {{ end }}

              {{ else }}
                <p>Failed to fetch queue: {{ $queueRes.Response.Status }}</p>
              {{ end }}

            {{ else }}
              <p>Failed to get token: {{ $tokenRes.Response.Status }}</p>
            {{ end }}

    - size: small
      widgets:
        - type: custom-api
          title: To-Do
          cache: 15s
          url: http://ics-proxy:3000/home-tasks
          template: |
            {{ if eq (len (.JSON.Array "")) 0 }}
              <p class="color-muted">Keine offenen Aufgaben.</p>
            {{ else }}
              <ul class="list list-gap-10" style="max-height:220px; overflow-y:auto; padding-right:4px;">
                {{ range .JSON.Array "" }}
                  <li style="display:flex; align-items:flex-start; gap:8px;">
                    <input type="checkbox" style="margin-top:2px; cursor:pointer; flex-shrink:0; width:14px; height:14px;"
                      onchange="(async function(el){
                        if(!el.checked) return;
                        el.disabled=true;
                        const li = el.closest('li');
                        await fetch('/tasks-api/complete-home-task',{method:'POST',headers:{'Content-Type':'application/json','X-Api-Token':'${API_TOKEN}'},body:JSON.stringify({uid:'{{ .String "uid" }}'})});
                        if (li) { li.style.transition='opacity .2s'; li.style.opacity='0'; setTimeout(()=>li.remove(),200); }
                      })(this)">
                    <div>
                      <div class="size-h4">{{ .String "title" }}</div>
                      {{ if .String "start" }}
                        <div class="size-h6 color-muted">Start: {{ .String "start" }}</div>
                      {{ end }}
                      {{ if .String "due" }}
                        <div class="size-h6 color-muted">Fällig: {{ .String "due" }}</div>
                      {{ end }}
                    </div>
                  </li>
                {{ end }}
              </ul>
            {{ end }}
            <form data-todo-form="home" style="display:flex; flex-direction:column; gap:6px; margin-top:10px;"
              onsubmit="(async function(e){
                e.preventDefault();
                const f = e.target;
                const title = f.querySelector('input[name=title]').value.trim();
                if (!title) return;
                const startDate = f.querySelector('input[name=startDate]').value || null;
                const endDate = f.querySelector('input[name=endDate]').value || null;
                await fetch('/tasks-api/home-tasks',{method:'POST',headers:{'Content-Type':'application/json','X-Api-Token':'${API_TOKEN}'},body:JSON.stringify({title,startDate,endDate})});
                f.reset();
                ['home-todo-title','home-todo-startDate','home-todo-endDate','home-todo-focus'].forEach(k=>localStorage.removeItem(k));
                // No reload: this widget's own cache (15s) plus the live
                // update stream will bring the new task in on its own.
              })(event)">
              <div style="display:flex; gap:6px;">
                <input name="title" type="text" placeholder="Aufgabe hinzufügen…" style="flex:1; background:var(--color-widget-background); border:1px solid var(--color-widget-content-border); border-radius:4px; padding:4px 8px; color:inherit; font-size:inherit;">
                <button type="submit" style="background:var(--color-primary); border:none; border-radius:4px; padding:4px 10px; color:#fff; cursor:pointer; font-size:1.1rem; font-weight:bold;">+</button>
              </div>
              <div style="display:flex; gap:6px;">
                <input name="startDate" type="date" style="flex:1; background:var(--color-widget-background); border:1px solid var(--color-widget-content-border); border-radius:4px; padding:4px 8px; color:inherit; font-size:inherit;">
                <input name="endDate" type="date" style="flex:1; background:var(--color-widget-background); border:1px solid var(--color-widget-content-border); border-radius:4px; padding:4px 8px; color:inherit; font-size:inherit;">
              </div>
            </form>
            <!-- Glance's live updates morph this widget's HTML via Idiomorph
                 (not a plain innerHTML swap), and Idiomorph forces an
                 <input>'s live value back to empty whenever the freshly
                 rendered server HTML has no `value` attribute — which ours
                 never does, regardless of focus (Glance's morph call doesn't
                 pass Idiomorph's `ignoreActiveValue` option). This happens on
                 every live update, not just the 15s cache refresh. A one-shot
                 restore (e.g. img-onerror alone) isn't enough since it only
                 fires once at page load; this installs a small recurring
                 poll that re-fills the field from localStorage whenever it
                 gets wiped, using data-todo-form to always re-find the live
                 form (in case Idiomorph ever replaces the node outright
                 rather than just clearing its value). Draft is cleared on
                 successful submit above. -->
            <img src="x" onerror="(function(){if(window.__homeTodoPoll)return;window.__homeTodoPoll=true;var sel='form[data-todo-form=&quot;home&quot;]';var prefix='home-todo-';var fields=['title','startDate','endDate'];function bind(){var f=document.querySelector(sel);if(!f)return;fields.forEach(function(n){var el=f.querySelector('input[name=&quot;'+n+'&quot;]');if(!el||el.dataset.bound)return;el.dataset.bound='1';var k=prefix+n;var v=localStorage.getItem(k);if(v)el.value=v;el.addEventListener('input',function(){localStorage.setItem(k,this.value)});el.addEventListener('focus',function(){localStorage.setItem(prefix+'focus',n)});el.addEventListener('blur',function(){if(localStorage.getItem(prefix+'focus')===n)localStorage.removeItem(prefix+'focus')})})}bind();setInterval(function(){var f=document.querySelector(sel);if(!f)return;bind();fields.forEach(function(n){var el=f.querySelector('input[name=&quot;'+n+'&quot;]');if(!el)return;var saved=localStorage.getItem(prefix+n)||'';if(saved&&!el.value)el.value=saved});var af=localStorage.getItem(prefix+'focus');if(af&&document.activeElement===document.body){var el2=f.querySelector('input[name=&quot;'+af+'&quot;]');if(el2)el2.focus()}},300);this.remove()})();" style="display:none">

        - type: server-stats
          servers:
            - type: local
              name: Glance Host

        # Replaces the old activity-list Strava widget (redundant with the
        # full Strava page's charts) with a compact operational status panel:
        # last Strava sync, last Health import, semantic-search index state,
        # and cache freshness — reads /status, the same endpoint used for
        # troubleshooting elsewhere in this repo (see CLAUDE.md).
        - type: custom-api
          title: Status
          cache: 1m
          url: http://ics-proxy:3000/status
          template: |
            <ul class="list list-gap-10">
              <li>
                <div class="size-h6 color-muted">Strava-Sync</div>
                <div class="size-h4">
                  {{ if .JSON.String "strava.lastSync.atLabel" }}{{ .JSON.String "strava.lastSync.atLabel" }}{{ else }}nie{{ end }}
                  {{ if .JSON.Float "strava.dbActivities" }} · {{ printf "%.0f" (.JSON.Float "strava.dbActivities") }} Aktivitäten{{ end }}
                </div>
              </li>
              <li>
                <div class="size-h6 color-muted">Health-Import</div>
                <div class="size-h4">
                  {{ if .JSON.String "health.lastIngest.atLabel" }}{{ .JSON.String "health.lastIngest.atLabel" }}{{ else }}nie{{ end }}
                </div>
              </li>
              {{ if .JSON.Bool "embeddings.configured" }}
              <li>
                <div class="size-h6 color-muted">Notizen-Index</div>
                <div class="size-h4">
                  {{ printf "%.0f" (.JSON.Float "embeddings.indexedNotes") }} Notizen
                  {{ if .JSON.String "embeddings.lastSync.atLabel" }} · {{ .JSON.String "embeddings.lastSync.atLabel" }}{{ end }}
                </div>
              </li>
              {{ end }}
              <li>
                <div class="size-h6 color-muted">Caches</div>
                <div class="size-h5">
                  EWS {{ if .JSON.Bool "caches.ews.populated" }}✓{{ else }}–{{ end }}
                  · ICS {{ if .JSON.Bool "caches.ics.populated" }}✓{{ else }}–{{ end }}
                  · Tasks {{ if .JSON.Bool "caches.homeTasks.populated" }}✓{{ else }}–{{ end }}/{{ if .JSON.Bool "caches.workTasks.populated" }}✓{{ else }}–{{ end }}
                  · Wetter {{ len (.JSON.Array "caches.weather.days") }}d
                </div>
              </li>
              <li>
                <div class="size-h6 color-muted">Backends</div>
                <div class="size-h5">
                  Exchange {{ if .JSON.Bool "backends.exchange" }}✓{{ else }}–{{ end }}
                  · Nextcloud {{ if .JSON.Bool "backends.nextcloud" }}✓{{ else }}–{{ end }}
                  · Wetter {{ if .JSON.Bool "backends.weather" }}✓{{ else }}–{{ end }}
                </div>
              </li>
              <li>
                <div class="size-h6 color-muted">Digest</div>
                <div class="size-h5">
                  Täglich {{ if .JSON.Bool "digests.daily.enabled" }}✓ ({{ .JSON.String "digests.daily.cron" }}){{ else }}–{{ end }}
                  · Wöchentlich {{ if .JSON.Bool "digests.weekly.enabled" }}✓{{ else }}–{{ end }}
                </div>
              </li>
            </ul>
